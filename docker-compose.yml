# Paste this straight into Dockhand (or run `docker compose up -d`).
# Edit the two lines under "required" and you are done.

services:
  iou:
    image: ghcr.io/dsaderholm/iou:latest
    container_name: iou
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - iou-data:/data

    environment:
      # ---- required -----------------------------------------------------
      ADMIN_USER: "me"
      ADMIN_PASSWORD: "change-this-to-something-long"

      # ---- optional -----------------------------------------------------
      # Payment buttons on the share page. Blank means the button is absent.
      VENMO_HANDLE: ""
      PAYPAL_ME: ""
      CASHAPP_HANDLE: ""

      # Header title, and "you owe to <OWNER_NAME>" on the share page.
      SITE_TITLE: "IOU"
      OWNER_NAME: ""

      # The address people actually open, e.g. https://iou.example.com
      # Share links are built from it. Set this if a proxy rewrites Host.
      PUBLIC_BASE_URL: ""

      TZ: "America/Denver"

      # How many reverse proxies sit in front of the app. 1 for a single proxy or
      # a Cloudflare Tunnel straight to the container; 2 for Cloudflare in front
      # of Nginx Proxy Manager, Caddy, Traefik and the like. A failed login logs
      # the address it saw, so one wrong password tells you if this is right.
      # TRUST_PROXY: "2"

      # Sure review inbox (see README). A read-only API key is enough.
      # SURE_URL: "https://finance.example.com"
      # SURE_API_KEY: ""
      # SURE_CATEGORY: "Owed to me"

      # Read-only JSON at /api/summary.json for dashboards, Home Assistant, or
      # a finance app. Blank means the route does not exist at all. Use a long
      # random string; it is a password.
      API_TOKEN: ""

      # A backup is written to /data/backups on every start (so every upgrade
      # snapshots first) and then once a day, keeping the newest 14.
      BACKUP_ENABLED: "true"
      BACKUP_KEEP: "14"
      BACKUP_INTERVAL_HOURS: "24"

      # Blank: a random session secret is written to /data on first run and
      # reused. Set it to keep logins alive across a wiped volume.
      SESSION_SECRET: ""

      # Prefer not to keep the password in plaintext here? Generate a hash with
      #   docker run --rm ghcr.io/dsaderholm/iou:latest node scripts/hash-password.js 'pw'
      # then delete ADMIN_PASSWORD above and set this instead. Compose treats a
      # lone "$" as a variable, so DOUBLE every one: $$2b$$12$$...
      # ADMIN_PASSWORD_HASH: ""

    # No healthcheck block on purpose. The image ships its own, hitting
    # /healthz, and a healthcheck here would override it -- which is how a
    # pasted stack ends up pinned to an old probe forever, still reporting
    # healthy after the check it uses has been replaced. Leaving it out means
    # this stack picks up whatever the image knows to check.

volumes:
  iou-data:
